routing:
  LOW: open
  MEDIUM: frontier
  HIGH: frontier
escalation:                      # LOW-risk cases escalate to frontier when ANY applies
  min_anomalous_sensors: 2
  min_plausible_failure_modes: 3
  low_signal_confidence_below: 0.45
  complex_question_keywords: ["work order", "recommend", "root cause", "compare", "why multiple"]
  conflicting_directions: true
pricing_usd_per_1m_tokens:       # CONFIGURE to your negotiated Azure pricing
  open:     {input: 0.15, output: 0.60}
  frontier: {input: 2.50, output: 10.00}
llm:
  temperature: 0.1
  max_completion_tokens: 1800
  timeout_seconds: 60
  max_retries: 1
